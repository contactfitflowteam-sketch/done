name: FitFlow Fast Diagnostic & APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  diagnose-and-build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Enable Corepack & Yarn
        run: corepack enable

      - name: 6. Load Environment Variables
        run: |
          if [ -f admob.env ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                ''|\#*) ;;
                *) echo "$line" >> $GITHUB_ENV ;;
              esac
            done < admob.env
          fi

      - name: 7. Install Dependencies
        working-directory: ./frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: yarn install --ignore-scripts

      - name: 8. Test JS & Notifications (Instant Error Check)
        working-directory: ./frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          echo "Testing JavaScript bundle and imports..."
          npx expo export --platform android --no-minify

      - name: 9. Expo Clean Prebuild
        working-directory: ./frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npx expo prebuild --platform android --clean --no-install

      - name: 10. Configure Android & Gradle RAM
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties

      - name: 11. Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore ${{ github.workspace }}/release.keystore \
            -storepass fitflowpass \
            -alias fitflowkey \
            -keypass fitflowpass \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=FitFlow, OU=App, O=FitFlow, L=NA, S=NA, C=IN"

      - name: 12. Make Gradlew Executable
        working-directory: ./frontend/android
        run: chmod +x gradlew

      - name: 13. Build Signed Release APK
        working-directory: ./frontend/android
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          EXPO_PUBLIC_AD_MODE: ${{ env.EXPO_PUBLIC_AD_MODE }}
          EXPO_PUBLIC_ADMOB_BANNER_ID: ${{ env.EXPO_PUBLIC_ADMOB_BANNER_ID }}
          EXPO_PUBLIC_ADMOB_INTERSTITIAL_ID: ${{ env.EXPO_PUBLIC_ADMOB_INTERSTITIAL_ID }}
          EXPO_PUBLIC_ADMOB_NATIVE_ID: ${{ env.EXPO_PUBLIC_ADMOB_NATIVE_ID }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease -x test \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.keystore \
            -Pandroid.injected.signing.store.password=fitflowpass \
            -Pandroid.injected.signing.key.alias=fitflowkey \
            -Pandroid.injected.signing.key.password=fitflowpass

      - name: 14. Find and Copy APK
        run: |
          mkdir -p out
          find frontend/android/app/build/outputs/apk -type f -name "*.apk" -exec cp {} out/FitFlow-release.apk \;
          ls -la out/

      - name: 15. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitFlow-release-apk
          path: out/FitFlow-release.apk
          retention-days: 30
