name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    name: Build Release APK (signed)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Load AdMob env vars from admob.env
        run: |
          if [ -f admob.env ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                ''|\#*) ;;
                *) echo "$line" >> $GITHUB_ENV ;;
              esac
            done < admob.env
          fi

      - name: Install frontend dependencies
        working-directory: ./frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: yarn install --ignore-scripts

      - name: Expo prebuild (Android)
        working-directory: ./frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure Gradle Environment
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties

      - name: Generate release signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore ${{ github.workspace }}/release.keystore \
            -storepass fitflowpass \
            -alias fitflowkey \
            -keypass fitflowpass \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=FitFlow, OU=App, O=FitFlow, L=NA, S=NA, C=IN"

      - name: Make gradlew executable
        working-directory: ./frontend/android
        run: chmod +x gradlew

      - name: Build signed Release APK
        working-directory: ./frontend/android
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          EXPO_PUBLIC_AD_MODE: ${{ env.EXPO_PUBLIC_AD_MODE }}
          EXPO_PUBLIC_ADMOB_BANNER_ID: ${{ env.EXPO_PUBLIC_ADMOB_BANNER_ID }}
          EXPO_PUBLIC_ADMOB_INTERSTITIAL_ID: ${{ env.EXPO_PUBLIC_ADMOB_INTERSTITIAL_ID }}
          EXPO_PUBLIC_ADMOB_NATIVE_ID: ${{ env.EXPO_PUBLIC_ADMOB_NATIVE_ID }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease -x test \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.keystore \
            -Pandroid.injected.signing.store.password=fitflowpass \
            -Pandroid.injected.signing.key.alias=fitflowkey \
            -Pandroid.injected.signing.key.password=fitflowpass 2>&1 | tee build.log || (echo -e "\n\n========== EXACT ERROR ==========\n"; grep -E "(\* What went wrong|Execution failed|FAILURE:|error:|FAILED)" -A 10 -B 2 build.log | tail -n 35; exit 1)

      - name: Find and copy APK
        run: |
          mkdir -p out
          find frontend/android/app/build/outputs/apk -type f -name "*.apk" -exec cp {} out/FitFlow-release.apk \;
          ls -la out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitFlow-release-apk
          path: out/FitFlow-release.apk
          retention-days: 30